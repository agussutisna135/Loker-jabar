<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Memuat lowongan | LokerJabar</title>
<style>body{font-family:Arial,sans-serif;margin:0;padding:40px 20px;color:#18324b;text-align:center}p{color:#526174}</style>
</head>
<body>
<h2>Memuat halaman lowongan…</h2>
<p>Mohon tunggu sebentar.</p>
<script>
(async function(){
  try{
    const response=await fetch("/index.html",{cache:"no-store"});
    if(!response.ok)throw new Error("Halaman utama tidak dapat dimuat");
    const html=await response.text();
    document.open();
    document.write(html);
    document.close();
  }catch(error){
    document.body.innerHTML="<h2>Halaman belum dapat dibuka</h2><p>Periksa koneksi internet, lalu coba lagi.</p><a href=\"/\">Kembali ke beranda</a>";
  }
})();
</script>
<noscript>Aktifkan JavaScript untuk membuka lowongan. <a href="/">Kembali ke beranda</a></noscript>
</body>
</html>
