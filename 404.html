<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Mengarahkan ke lowongan | LokerJabar</title>
<script>
(function(){
  var match=window.location.pathname.match(/^\/lowongan\/(.+)\/?$/);
  if(match){
    var slug=decodeURIComponent(match[1]);
    var idMatch=slug.match(/(job-[a-z0-9-]+)$/i);
    if(idMatch){
      window.location.replace("/?job="+encodeURIComponent(idMatch[1]));
      return;
    }
  }
  window.location.replace("/");
})();
</script>
</head>
<body>
<p>Alamat lowongan sedang dibuka. Jika tidak berpindah otomatis, <a href="/">kembali ke LokerJabar</a>.</p>
</body>
</html>
